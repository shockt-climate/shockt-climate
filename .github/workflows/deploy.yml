name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject secrets into app spec
        run: |
          yq -i '(.services[0].envs[] | select(.key == "DATABASE_URL")).value = strenv(DATABASE_URL)' .do/app.yaml
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Verify injection
        run: |
          yq '.services[0].envs[] | select(.key == "DATABASE_URL") | .value | length' .do/app.yaml

      - name: Deploy to DigitalOcean App Platform
        uses: digitalocean/app_action/deploy@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          print_build_logs: true
